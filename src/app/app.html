
<main class="layout">

  <header class="topbar">

    <!-- LOGO Y NOMBRE -->
    <div class="brand">
      <div class="brand-icon">CL</div>

      <div>
        <h1>CampusLab</h1>
        <p>Reserva de laboratorios y equipos académicos</p>
      </div>
    </div>

    <!-- MENÚ SEGÚN ROL -->
    <nav class="nav" *ngIf="initialized && isLoggedIn()">

      <!-- Dashboard para usuarios autenticados -->
      <a
        routerLink="/dashboard"
        routerLinkActive="active">
        Dashboard
      </a>

      <!-- ESTUDIANTE -->
      <a
        *ngIf="hasRole('ESTUDIANTE')"
        routerLink="/bookings"
        routerLinkActive="active">
        Mis reservas
      </a>

      <!-- TÉCNICO Y ADMIN -->
      <a
        *ngIf="hasAnyRole(['TECNICO', 'ADMIN'])"
        routerLink="/bookings"
        routerLinkActive="active">
        Gestión de reservas
      </a>

      <!-- ADMINISTRADOR -->
      <a
        *ngIf="hasRole('ADMIN')"
        routerLink="/rabbit-admin"
        routerLinkActive="active">
        RabbitMQ Admin
      </a>

      <!-- AUDITOR -->
      <a
        *ngIf="hasAnyRole(['AUDITOR', 'ADMIN'])"
        routerLink="/audit"
        routerLinkActive="active">
        Auditoría
      </a>

      <!-- USUARIO -->
      <span
        *ngIf="userRoles.length > 0"
        class="user-role">
        {{ userRoles.join(', ') }}
      </span>

      <!-- CERRAR SESIÓN -->
      <button
        type="button"
        (click)="logout()">
        Cerrar sesión
      </button>

    </nav>

  </header>

  <section class="content">
    <router-outlet></router-outlet>
  </section>

</main>
